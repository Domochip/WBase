<div class="card">
    <div class="card-h">
        <h2>Live data<span id="l" class="ld">Loading...</span></h2>
        <span class="pill" id="liveState"><span class="dot"></span><span>Waiting</span></span>
        <span class="sub" id="lastRefresh"></span>
    </div>
    <div class="card-b">
        <div class="live-grid" id="liveData"></div>
    </div>
</div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('2'), used in API endpoints like '/gs' + id

    const age = ageLabel($('#lastRefresh', root));

    // liveData values as tiles (see the live data helpers in index_template.html)
    function showLiveData(liveData) {
        updateTiles($('#liveData', root), liveData);
        age.touch();
    }

    loadStatus(root, id, {
        afterLoad: function (status) {
            if (status.liveData) showLiveData(status.liveData);
        },
    });

    // live updates while the page is shown (server-sent events of this part)
    const stopEvents = connectEvents(id, showLiveData, $('#liveState', root));

    // Called when leaving the page
    return function () {
        stopEvents();
        age.stop();
    };
</script>
