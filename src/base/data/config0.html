<h2 class="content-subhead">System<span id="l" class="ld">Loading...</span></h2>

<form class="pure-form pure-form-aligned" id='f' method='POST' action='/sc0'>
    <fieldset>
        <div class="pure-control-group">
            <label for="tz">NTP Timezone</label>
            <input type='text' id='tz' name='tz' maxlength='64' placeholder='e.g., UTC0, EST5EDT,M3.2.0,M11.1.0'>
            <span class="pure-form-message-inline">POSIX TZ string (e.g., UTC0, CET-1CEST,M3.5.0,M10.5.0)</span>
        </div>
        <div class="pure-controls">
            <input type='submit' value='Save' class="pure-button pure-button-primary" disabled>
        </div>
    </fieldset>
</form>
<span id='r'></span>

<form class="pure-form pure-form-aligned" id='f0' method='POST' action='/rbt'>
    <fieldset>
        <div class="pure-controls">
            <input type='submit' name='subRbt' id='subRbt' value='Reboot' class="pure-button pure-button-primary btn-warn">
        </div>
    </fieldset>
</form>
<form class="pure-form pure-form-aligned" id='f0b' method='POST' action='/rbtrsc'>
    <fieldset>
        <div class="pure-controls">
            <input type='submit' name='subRbtRsc' id='subRbtRsc' value='Reboot in Rescue Mode'
                class="pure-button pure-button-primary btn-err">
        </div>
    </fieldset>
</form>

<script>
    // qsp is substituted at build time by pio_pre_build_spa.py — var qsp = '#content0 ';

    $(qsp + "#f").addEventListener('submit', function (event) {
        event.preventDefault();
        $(qsp + '#r').innerHTML = "Saving Configuration...";
        post("/sc" + qsp[8],
            convertFormToJson($(qsp + "#f")),
            function () {
                $(qsp + "#f").style.display = 'none';

                $(qsp + '#r').innerHTML = '<h3><b>Configuration saved <span class="ok">successfully</span>. System is restarting now.</b></h3>Waiting for device... <span id="cd">0</span>s';
                redirectWhenReachable(location.origin, 30000);
            },
            function () {
                $(qsp + '#r').innerHTML = '<h3><b>Configuration <span class="err">error</span>.</b></h3>';
            }
        );
    });

    // Load configuration
    getJSON("/gc" + qsp[8],
        function (GC) {
            for (k in GC) {
                if ($(qsp + '#' + k)) {
                    if ($(qsp + '#' + k).type != 'checkbox') $(qsp + '#' + k).value = GC[k];
                    else $(qsp + '#' + k).checked = GC[k];

                    triggerEvent($(qsp + '#' + k), 'change');
                }
            }

            $(qsp + "#f input[type=submit]").disabled = false;
            fadeOut($(qsp + "#l"));
        }, 
        function () {
            $(qsp + "#l").innerHTML = '<span class="err">Failed</span>';
        }
    );

    function postFailed() {
        $(qsp + '#r').innerHTML = '<span class="err">Failed</span>';
        $(qsp + '#f0').reset();
        $(qsp + '#f0b').reset();
        $(qsp + '#subRbt').disabled = false;
        $(qsp + '#subRbtRsc').disabled = false;
    };

    function handleSubmit(event, url, successMessage, targetUrl) {
        event.preventDefault();
        $(qsp + '#subRbt').disabled = true;
        $(qsp + '#subRbtRsc').disabled = true;

        post(url, null, function () {
            $(qsp + '#r').innerHTML = `<h3><span class="ok">Done</span> ${successMessage} Waiting for device... <span id="cd">0</span>s</h3>`;
            redirectWhenReachable(targetUrl, 30000);
        }, postFailed);
    }

    $(qsp + "#f0").addEventListener('submit', function (evt) {
        handleSubmit(evt, '/rbt', 'System will reboot shortly.', location.origin);
    });

    $(qsp + "#f0b").addEventListener('submit', function (evt) {
        handleSubmit(evt, '/rbt?rescue=true', 'System will reboot shortly in RESCUE MODE. You\'ll need to connect to module WiFi.', 'http://192.168.4.1');
    });
</script>
